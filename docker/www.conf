[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4

; PHP-FPM's default (yes) strips the container's environment before PHP
; workers start, keeping only vars explicitly listed with env[...] here --
; that silently breaks the whole "configure CI4 via env vars" approach
; (Kubernetes Secrets/ConfigMap, docker-compose's `environment:`) since
; getenv()/$_ENV/$_SERVER would never see them.
clear_env = no

; Route worker stdout/stderr and PHP's own error_log() through FPM's log
; pipe, pointed at the container's stderr -- this is what
; app/Config/Logger.php's production ErrorlogHandler ends up writing to,
; so `kubectl logs` shows it.
catch_workers_output = yes
decorate_workers_output = no
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
